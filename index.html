<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CrediBarrio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- MÓDULO: Inicio de Sesión (CrediBarrio) -->
    <div class="login-card">
        <h2>Bienvenido a CrediBarrio</h2>
        <p>Ingresa a tu cuenta para gestionar tus finanzas</p>

        <form>
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="usuario@ejemplo.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>

        <div class="form-footer">
            ¿No tienes una cuenta? <a href="#">Regístrate en CrediBarrio</a>
        </div>
    </div>

</body>
</html>
